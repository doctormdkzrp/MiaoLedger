# 小喵记账 · 部署编排（默认方式）
#
#   cp .env.example .env    # 改成你自己的口令 / 密钥
#   docker compose up -d
#
# 启动后：
#   管理台    http://localhost:8080
#   接口文档  http://localhost:8000/docs
#
# 只想要接口、不要管理台：docker compose up -d db api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miaoledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-miaoledger}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miaoledger} -d ${POSTGRES_DB:-miaoledger}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-miaoledger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-miaoledger}
      INVITE_CODE: ${INVITE_CODE:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      VOLC_API_KEY: ${VOLC_API_KEY:-}
      VOLC_RESOURCE_ID: ${VOLC_RESOURCE_ID:-volc.seedasr.sauc.duration}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${API_PORT:-8000}:8000"

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:80"

volumes:
  db_data:
