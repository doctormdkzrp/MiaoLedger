name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue，确认没有重复建议。
        本项目为自部署的个人记账系统，不提供托管服务，涉及云端托管的建议可能不在范围内。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前遇到的实际困难，而不是直接描述实现方式。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述希望达到的效果，可附界面示意或接口设想。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 列出已考虑的其他做法及其取舍。
    validations:
      required: false
